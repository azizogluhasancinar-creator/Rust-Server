<div class="workspace"><aside class="filters"><div class="filter-title">⌁ <strong data-i18n="filters"></strong><button id="reset" data-i18n="reset"></button></div><div class="filter-field"><label for="search" data-i18n="searchLabel"></label><div class="search-wrap"><span>⌕</span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></div></div><div class="filter-field"><label for="region" data-i18n="region"></label><select id="region"><option value="all" data-i18n="allRegions"></option><option value="EU" data-i18n="EU"></option><option value="NA" data-i18n="NA"></option><option value="AS" data-i18n="AS"></option><option value="OC" data-i18n="OC"></option><option value="SA" data-i18n="SA"></option></select></div><div class="filter-field"><label for="capacity"><span data-i18n="capacity"></span><output id="capacity-label">1000</output></label><input id="capacity" type="range" min="100" max="1000" step="50" value="1000"><div class="range-label"><span>100</span><span>1000</span></div></div><div class="filter-field"><label for="wipe" data-i18n="wipeInterval"></label><select id="wipe"><option value="all" data-i18n="allWipes"></option><option value="7" data-i18n="weekly"></option><option value="14" data-i18n="fortnightly"></option><option value="30" data-i18n="monthly"></option></select></div><div class="filter-field"><label for="rate" data-i18n="gatherRate"></label><select id="rate"><option value="all" data-i18n="allRates"></option><option value="1">1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option><option value="5">5x</option><option value="10">10x</option></select></div><div class="filter-field"><label for="type" data-i18n="serverType"></label><select id="type"><option value="all" data-i18n="allTypes"></option><option value="vanilla" data-i18n="vanilla"></option><option value="modded" data-i18n="modded"></option></select></div><div class="filter-tip"><span>↗</span><strong data-i18n="tipTitle"></strong><p data-i18n="tip"></p></div></aside>
<div class="results"><div class="results-toolbar"><div aria-live="polite"><strong id="result-count"></strong> <span data-i18n="found"></span></div><label class="sort-label"><span data-i18n="sort"></span><select id="sort"><option value="fresh" data-i18n="sortFresh"></option><option value="players" data-i18n="sortPlayers"></option><option value="capacity" data-i18n="sortCapacity"></option></select></label></div><div id="server-grid" class="server-grid"></div><div class="results-foot"><span>●</span> <b data-i18n="listNote"></b></div></div></div></section>
</main><footer><a class="footer-brand" href="#">◈ WIPE RADAR</a><span data-i18n="footerTag"></span><span data-i18n="disclaimer"></span></footer>
<dialog id="server-dialog"><div id="dialog-content"></div></dialog><script>const specs = [
 ['rustoria','Rustoria.co','EU Main','EU',600,482,7,0.4,'Vanilla','MAIN',0],
 ['rustafied','Rustafied.com','EU Odd','EU',350,288,7,1.2,'Vanilla','ODD',1],
 ['moose','Rusty Moose','US Monthly','NA',500,396,30,2.5,'Vanilla','MONTHLY',2],
 ['vital','Vital Rust','EU 2x Mondays','EU',300,267,7,4,'2x','MONDAYS',3],
 ['stevious','Stevious','US 2x Main','NA',450,342,7,6,'2x','MAIN',4],
 ['bloolagoon','Bloo Lagoon','EU Solo / Duo / Trio','EU',200,156,14,8,'1.5x','TRIO',5],
 ['rustsea','Rust SEA','Asia Main','AS',250,179,7,10,'Vanilla','ASIA',6],
 ['sydney','Rust Australia','AU Fortnightly','OC',200,128,14,16,'Vanilla','AU',7],
 ['andes','Andes Rust','BR Monthly','SA',150,96,30,21,'2x','BR',8],
 ['outpost','Outpost Demo','EU 3x Solo','EU',150,112,7,3,'3x','SOLO',9],
 ['nightfall','Nightfall Demo','NA 5x PvP','NA',200,163,14,5,'5x','PVP',10],
 ['havoc','Havoc Demo','EU 10x Battlefield','EU',100,76,7,12,'10x','PVP',11]
];
const servers = specs.map(([id,name,subtitle,region,capacity,players,wipeDays,wipeHours,mode,mark,seed])=>{
 const rate=mode==='Vanilla'?1:Number.parseFloat(mode);
 const modded=mode!=='Vanilla';
 // Hourly samples cover each complete historical wipe, including its final hour.
 const history = [1,2,3].map(period=>({period,points:Array.from({length:wipeDays*24+1},(_,hour)=>{
  const progress=hour/(wipeDays*24);
  const retention=0.9*Math.exp(-progress*(1.1+seed%3*.3))+.08;
  const daily=.77+.17*Math.cos((hour-19)*Math.PI/12);
  const launch=hour<5?.55+hour*.09:1;
  const variation=Math.sin(hour*.19+seed+period)*.025+(2-period)*.025;
  return Math.max(0,Math.min(capacity,Math.round(capacity*(retention*daily*launch+variation))));
 })}));
 return {id,name,subtitle,region,capacity,players,wipeDays,wipeHours,mode,rate,modded,mark,seed,history};
});
function filterServers(list, {query='', region='all',capacity=1000,wipe='all',rate='all',type='all',sort='fresh',favoritesOnly=false,favorites=[]}={}) {
 return list.filter(s => `${s.name} ${s.subtitle} ${s.mode}`.toLowerCase().includes(query.trim().toLowerCase()) && (region==='all'||s.region===region) && s.capacity<=Number(capacity) && (wipe==='all'||s.wipeDays===Number(wipe)) && (rate==='all'||s.rate===Number(rate)) && (type==='all'||s.modded===(type==='modded')) && (!favoritesOnly||favorites.includes(s.id))).sort((a,b)=>sort==='players'?b.players-a.players:sort==='capacity'?a.capacity-b.capacity:a.wipeHours-b.wipeHours);
}
function averageHistory(server) { return server.history[0].points.map((_,i)=>Math.round(server.history.reduce((sum,h)=>sum+h.points[i],0)/server.history.length)); }

const $ = id => document.getElementById(id);
const messages={
tr:{navigation:'Ana menü',language:'Dil',discover:'Sunucuları keşfet',favorites:'Favoriler',demoMode:'ÖRNEK VERİ MODU',eyebrow:'YENİ WIPE. YENİ BİR HİKÂYE.',headline:'İyi bir başlangıç,',headlineAccent:'doğru sunucuyla.',intro:'Saatlerce sunucu arama. Wipe’ı yakala, tüm wipe boyunca kalabalığı gör, bir sonraki evini bul.',summary:'Örnek sunucu özeti',sampleServers:'örnek sunucu',samplePlayers:'örnek çevrimiçi oyuncu',freshWipes:'son 6 saatte wipe',noLive:'Canlı bağlantı henüz yok',allDemo:'Tüm sayılar demo amaçlıdır',adventure:'BİR SONRAKİ MACERAN',caption:'Daha az arama. Daha çok Rust.',filters:'Filtreler',reset:'Sıfırla',searchLabel:'SUNUCU ARA',searchPlaceholder:'İsim veya oyun modu…',region:'BÖLGE',allRegions:'Tüm bölgeler',EU:'Avrupa · EU',NA:'Kuzey Amerika · NA',AS:'Asya · AS',OC:'Okyanusya · OC',SA:'Güney Amerika · SA',capacity:'MAKSİMUM KAPASİTE',wipeInterval:'WIPE ARALIĞI',allWipes:'Tüm wipe süreleri',weekly:'Haftalık · 7 gün',fortnightly:'İki haftalık · 14 gün',monthly:'Aylık · 30 gün',gatherRate:'KAYNAK TOPLAMA ORANI',allRates:'Tüm x oranları',serverType:'SUNUCU TÜRÜ',allTypes:'Tüm türler',vanilla:'Vanilla · modsuz',modded:'Modlu',tipTitle:'Sadece ilk günü değil.',tip:'Geçmiş wipe’ların tamamını karşılaştır. Haftalık 7, iki haftalık 14, aylık 30 gün; tüm grafikler aynı boyutta.',found:'sunucu bulundu',sort:'Sırala',sortFresh:'En yeni wipe',sortPlayers:'En çok oyuncu',sortCapacity:'En düşük kapasite',listNote:'Örnek liste · Gerçek zamanlı veri ve tam sunucu dizini henüz bağlı değil.',footerTag:'Yeni bir wipe. Eşit bir başlangıç.',disclaimer:'Rust ile resmî bağlantısı yoktur.',favoriteTitle:'Favori sunucuların',addFavorite:'favorilere ekle',removeFavorite:'favorilerden çıkar',days:'GÜN',day:'gün',players:'OYUNCULAR',minutes:'dk',hours:'sa',ago:'önce wipe',historyShort:'3 WIPE ORT. · ÖRNEK',analysis:'Wipe analizi',noFavorites:'Henüz favorin yok.',noResults:'Bu filtrelerde sunucu bulunamadı.',favoriteHelp:'Keşfet ekranındaki yıldızlara dokunarak sunucuları kaydet.',filterHelp:'Filtreleri genişlet veya sıfırla. Toplama oranı ve sunucu türü birlikte uygulanır.',intelligence:'WIPE İSTİHBARATI',close:'Kapat',detailIntro:'Wipe başlangıcından sonuna kadar oyuncu yoğunluğunu incele. Üç geçmiş wipe arasında geçiş yap veya aynı saatteki ortalamayı gör.',warning:'ÖRNEK VERİ · Grafikler üretilmiş demo verisidir. Gerçek sunucu geçmişi veya gelecek oyuncu tahmini değildir.',period:'Wipe dönemi',average:'3 wipe ortalaması',previous:'önceki wipe',axis:'Yatay eksen: wipe’tan itibaren geçen gün · Dikey eksen: oyuncu sayısı.',mean:'Üç geçmiş wipe’ın aynı saatteki oyuncu sayılarının aritmetik ortalaması. Günlük ortalama değildir; günlük iniş çıkışlar korunur.',fullWipe:'Tam wipe',sameSize:'Tüm sürelerde aynı grafik boyutu · saatlik örnekler',every:'Wipe aralığı',capacityFact:'Sunucu kapasitesi',modeFact:'Sunucu türü / oran',wipeStart:'Wipe',playerWord:'oyuncu',hourWord:'saat',per:'günde bir',chartHint:'Oyuncu sayısını görmek için grafiğin üzerinde gezin veya kaydırıcıyı kullan.',inspect:'Grafikteki saati incele',sample:'Örnek',chartLabel:'tam wipe boyunca oyuncu sayısı'},
en:{navigation:'Main navigation',language:'Language',discover:'Explore servers',favorites:'Favorites',demoMode:'DEMO DATA MODE',eyebrow:'NEW WIPE. NEW STORY.',headline:'A fresh start,',headlineAccent:'on the right server.',intro:'Stop searching for hours. Catch the wipe, see the crowd across the entire cycle, and find your next home.',summary:'Demo server summary',sampleServers:'sample servers',samplePlayers:'sample online players',freshWipes:'wiped in the last 6 hours',noLive:'Live data is not connected',allDemo:'All numbers are demo data',adventure:'YOUR NEXT ADVENTURE',caption:'Less searching. More Rust.',filters:'Filters',reset:'Reset',searchLabel:'SEARCH SERVERS',searchPlaceholder:'Name or game mode…',region:'REGION',allRegions:'All regions',EU:'Europe · EU',NA:'North America · NA',AS:'Asia · AS',OC:'Oceania · OC',SA:'South America · SA',capacity:'MAXIMUM CAPACITY',wipeInterval:'WIPE INTERVAL',allWipes:'All wipe intervals',weekly:'Weekly · 7 days',fortnightly:'Fortnightly · 14 days',monthly:'Monthly · 30 days',gatherRate:'GATHER RATE',allRates:'All multipliers',serverType:'SERVER TYPE',allTypes:'All server types',vanilla:'Vanilla · unmodded',modded:'Modded',tipTitle:'Beyond the first day.',tip:'Compare entire historical wipes. Weekly: 7 days, fortnightly: 14, monthly: 30. Every chart stays the same size.',found:'servers found',sort:'Sort',sortFresh:'Most recent wipe',sortPlayers:'Most players',sortCapacity:'Lowest capacity',listNote:'Sample list · Live data and the full server directory are not connected yet.',footerTag:'A new wipe. An equal start.',disclaimer:'Not officially affiliated with Rust.',favoriteTitle:'Your favorite servers',addFavorite:'add to favorites',removeFavorite:'remove from favorites',days:'DAYS',day:'days',players:'PLAYERS',minutes:'min',hours:'hr',ago:'since wipe',historyShort:'3-WIPE AVG · DEMO',analysis:'Wipe analysis',noFavorites:'No favorites yet.',noResults:'No servers match these filters.',favoriteHelp:'Use the stars in Explore to save your favorite servers.',filterHelp:'Broaden or reset your filters. Gather rate and server type apply together.',intelligence:'WIPE INTELLIGENCE',close:'Close',detailIntro:'Explore player counts from the start to the end of a wipe. Compare three historical wipes or view the average at each elapsed hour.',warning:'DEMO DATA · These charts use generated samples. They are not real server history or a forecast.',period:'Wipe period',average:'3-wipe average',previous:'wipes ago',axis:'Horizontal axis: days since wipe · Vertical axis: player count.',mean:'Arithmetic mean of three historical wipes at each elapsed hour. Not a daily average; daily peaks and dips remain visible.',fullWipe:'Full wipe',sameSize:'Same chart size for every interval · hourly samples',every:'Wipe interval',capacityFact:'Server capacity',modeFact:'Server type / rate',wipeStart:'Wipe',playerWord:'players',hourWord:'hours',per:'days per wipe',chartHint:'Hover over the chart or use the slider to inspect player counts.',inspect:'Inspect elapsed hour',sample:'Demo',chartLabel:'player count across the entire wipe'}
};
let language='tr';let favorites=[];let favoritesOnly=false;let activeServer=null;let activePeriod='avg';
try {language=localStorage.getItem('wipe-radar-language')==='en'?'en':'tr';const saved=JSON.parse(localStorage.getItem('wipe-radar-favorites')||'[]');favorites=Array.isArray(saved)?saved.filter(id=>servers.some(s=>s.id===id)):[];}catch{}
const t=key=>messages[language][key]||key;
const number=n=>new Intl.NumberFormat(language==='tr'?'tr-TR':'en-US').format(n);
function persist(key,value){try{localStorage.setItem(key,value);}catch{}}
function applyLanguage(){document.documentElement.lang=language;document.title=`Wipe Radar — ${t('discover')}`;$('language').value=language;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('total-servers').textContent=servers.length;$('total-players').textContent=number(servers.reduce((a,s)=>a+s.players,0));$('fresh-count').textContent=servers.filter(s=>s.wipeHours<=6).length;render();if(activeServer)renderDetails();}
function path(points,width,height,max,ox=0,oy=0){return points.map((p,i)=>`${i?'L':'M'}${(ox+i*width/(points.length-1)).toFixed(1)},${(oy+height-p/max*height).toFixed(1)}`).join(' ');}
function mini(s){const d=path(averageHistory(s),300,43,s.capacity,0,3);return `<div class="mini-wrap"><svg class="mini-chart" viewBox="0 0 300 49" preserveAspectRatio="none" role="img" aria-label="${s.wipeDays} ${t('day')} · ${t('chartLabel')}"><path d="${d} L300,49 L0,49 Z" fill="#ef82421a"/><path d="${d}" fill="none" stroke="#e4a16d" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><div class="mini-axis"><span>${t('wipeStart')}</span><span>${s.wipeDays} ${t('day')}</span></div></div>`;}
function render(){const matches=filterServers(servers,{query:$('search').value,region:$('region').value,capacity:$('capacity').value,wipe:$('wipe').value,rate:$('rate').value,type:$('type').value,sort:$('sort').value,favoritesOnly,favorites});$('result-count').textContent=matches.length;$('favorite-count').textContent=favorites.length;$('capacity-label').textContent=$('capacity').value;$('section-title').innerHTML=(favoritesOnly?t('favoriteTitle'):t('discover'))+'<span>.</span>';$('discover').classList.toggle('active',!favoritesOnly);$('favorites-tab').classList.toggle('active',favoritesOnly);
$('server-grid').innerHTML=matches.length?matches.map(s=>`<article class="server-card"><button class="favorite ${favorites.includes(s.id)?'selected':''}" data-favorite="${s.id}" aria-label="${s.name}: ${t(favorites.includes(s.id)?'removeFavorite':'addFavorite')}" aria-pressed="${favorites.includes(s.id)}">${favorites.includes(s.id)?'★':'☆'}</button><div class="card-head"><div class="server-logo logo-${s.seed%4}" aria-hidden="true">${s.name[0]}</div><div><h3 class="card-name">${s.name}</h3><div class="card-sub">${s.subtitle}</div></div></div><div class="badges"><span class="badge region">${s.region}</span><span class="badge">${s.rate}x</span><span class="badge">${s.modded?t('modded'):'Vanilla'}</span><span class="badge">${s.wipeDays} ${t('days')}</span></div><div class="wipe-line"><span class="wipe-badge ${s.wipeHours<2?'fresh':''}">ϟ ${s.wipeHours<1?Math.round(s.wipeHours*60)+' '+t('minutes'):s.wipeHours+' '+t('hours')} ${t('ago')}</span></div><div class="players-row"><span>${t('players')}</span><strong>${s.players} <small>/ ${s.capacity}</small></strong></div><div class="capacity-bar"><div style="width:${s.players/s.capacity*100}%"></div></div>${mini(s)}<div class="card-bottom"><span>${t('historyShort')}</span><button class="detail-button" data-detail="${s.id}" aria-label="${s.name}: ${t('analysis')}">${t('analysis')} <span>↗</span></button></div></article>`).join(''):`<div class="empty"><h3>${t(favoritesOnly&&!favorites.length?'noFavorites':'noResults')}</h3><p>${t(favoritesOnly&&!favorites.length?'favoriteHelp':'filterHelp')}</p><button class="detail-button" id="empty-reset">${t(favoritesOnly?'discover':'reset')}</button></div>`;
$('empty-reset')?.addEventListener('click',()=>{favoritesOnly=false;reset();});}
function reset(){for(const id of ['region','wipe','rate','type'])$(id).value='all';$('search').value='';$('capacity').value='1000';$('sort').value='fresh';render();}
for(const id of ['search','region','capacity','wipe','rate','type','sort'])$(id).addEventListener('input',render);
$('reset').addEventListener('click',reset);$('language').addEventListener('change',()=>{language=$('language').value;persist('wipe-radar-language',language);applyLanguage();});
$('discover').addEventListener('click',()=>{favoritesOnly=false;render();});$('favorites-tab').addEventListener('click',()=>{favoritesOnly=true;render();$('explore').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});
$('server-grid').addEventListener('click',e=>{const favorite=e.target.closest('[data-favorite]');if(favorite){const id=favorite.dataset.favorite;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];persist('wipe-radar-favorites',JSON.stringify(favorites));render();return;}const detail=e.target.closest('[data-detail]');if(detail){activeServer=servers.find(s=>s.id===detail.dataset.detail);activePeriod='avg';renderDetails();$('server-dialog').showModal();}});
function periodLabel(index){return language==='tr'?`${index+1}. ${t('previous')}`:`${index+1} ${t('previous')}`;}
function renderDetails(){const s=activeServer;$('dialog-content').innerHTML=`<div class="dialog-top"><div><div class="eyebrow">${t('intelligence')} · ${s.region}</div><h2>${s.name} <span>/ ${s.subtitle}</span></h2></div><button class="close-dialog" aria-label="${t('close')}">×</button></div><p class="dialog-desc">${t('detailIntro')}</p><div class="demo-warning">${t('warning')}</div><div class="chart-controls" aria-label="${t('period')}"><button data-period="avg">${t('average')}</button>${s.history.map((_,i)=>`<button data-period="${i}">${periodLabel(i)}</button>`).join('')}</div><div class="chart-heading"><strong>${t('fullWipe')} · ${s.wipeDays} ${t('day')}</strong><span>${t('sameSize')}</span></div><div id="chart"></div><label class="chart-inspector" for="chart-hour"><span>${t('inspect')}</span><output id="chart-value"></output></label><input id="chart-hour" type="range" min="0" max="${s.wipeDays*24}" value="0" step="1"><p class="graph-caption">${t('axis')}<br>${t('mean')}<br>${t('chartHint')}</p><div class="dialog-facts"><div><span>${t('every')}</span><strong>${s.wipeDays} ${t('per')}</strong></div><div><span>${t('capacityFact')}</span><strong>${s.capacity} ${t('playerWord')}</strong></div><div><span>${t('modeFact')}</span><strong>${s.modded?t('modded'):'Vanilla'} · ${s.rate}x</strong></div></div>`;
$('dialog-content').querySelector('.close-dialog').addEventListener('click',()=>$('server-dialog').close());$('dialog-content').querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{activePeriod=b.dataset.period;drawChart();}));$('chart-hour').addEventListener('input',()=>inspectHour(Number($('chart-hour').value)));drawChart();}
function selectedPoints(){return activePeriod==='avg'?averageHistory(activeServer):activeServer.history[Number(activePeriod)].points;}
function drawChart(){const s=activeServer,points=selectedPoints(),d=path(points,590,210,s.capacity,55,20),label=activePeriod==='avg'?t('average'):periodLabel(Number(activePeriod));const ticks=[0,...Array.from({length:5},(_,i)=>Math.round((i+1)*s.wipeDays/5))];
$('dialog-content').querySelectorAll('[data-period]').forEach(b=>{b.classList.toggle('active',b.dataset.period===activePeriod);b.setAttribute('aria-pressed',String(b.dataset.period===activePeriod));});
$('chart').innerHTML=`<svg class="large-chart" viewBox="0 0 680 275" role="img" aria-label="${label}, ${s.wipeDays} ${t('day')}, ${t('chartLabel')}"><title>${label} · ${s.wipeDays} ${t('day')}</title><desc>${t('axis')} ${points.length} ${t('sample')}.</desc>${[0,.25,.5,.75,1].map(v=>`<line x1="55" x2="645" y1="${230-v*210}" y2="${230-v*210}" stroke="#34383a" stroke-dasharray="3 5"/><text x="43" y="${234-v*210}" text-anchor="end" fill="#a4acb3" font-size="11">${Math.round(s.capacity*v)}</text>`).join('')}<path d="${d} L645,230 L55,230 Z" fill="#ef82421c"/><path d="${d}" fill="none" stroke="#eda873" stroke-width="1.5" stroke-linejoin="round"/>${ticks.map(day=>`<text x="${55+day*590/s.wipeDays}" y="253" text-anchor="middle" fill="#a4acb3" font-size="11">${day===0?t('wipeStart'):day+' '+t('day')}</text>`).join('')}<line id="chart-cursor" y1="20" y2="230" stroke="#ffffff70" stroke-dasharray="3 4"/><circle id="chart-dot" r="4" fill="#f4c29d" stroke="#171c20" stroke-width="2"/></svg>`;
$('chart').querySelector('svg').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect();const hour=Math.round(Math.max(0,Math.min(1,((e.clientX-r.left)/r.width*680-55)/590))*s.wipeDays*24);$('chart-hour').value=hour;inspectHour(hour);});inspectHour(Number($('chart-hour').value));}
function inspectHour(hour){const s=activeServer,points=selectedPoints(),x=55+hour/(s.wipeDays*24)*590,y=230-points[hour]/s.capacity*210;$('chart-value').textContent=`${Math.floor(hour/24)} ${t('day')} ${hour%24} ${t('hourWord')} · ${points[hour]} ${t('playerWord')}`;$('chart-cursor').setAttribute('x1',x);$('chart-cursor').setAttribute('x2',x);$('chart-dot').setAttribute('cx',x);$('chart-dot').setAttribute('cy',y);}
$('server-dialog').addEventListener('close',()=>{activeServer=null;});$('server-dialog').addEventListener('click',e=>{if(e.target===$('server-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
applyLanguage();
</script>
</body></html>
