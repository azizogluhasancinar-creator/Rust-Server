function applyLanguage(){document.documentElement.lang=language;document.title=`Wipe Radar — ${t('discover')}`;$('language').value=language;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('total-servers').textContent=servers.length;$('total-players').textContent=number(servers.filter(s=>s.observation).reduce((a,s)=>a+s.players,0));$('fresh-count').textContent=servers.filter(s=>s.observation).length;render();if(activeServer)renderDetails();}
function path(points,width,height,max,ox=0,oy=0){return points.map((p,i)=>`${i?'L':'M'}${(ox+i*width/(points.length-1)).toFixed(1)},${(oy+height-p/max*height).toFixed(1)}`).join(' ');}
function mini(s){const d=path(averageHistory(s),300,43,s.capacity,0,3);return `<div class="mini-wrap"><svg class="mini-chart" viewBox="0 0 300 49" preserveAspectRatio="none" role="img" aria-label="${s.wipeDays} ${t('day')} · ${t('chartLabel')}"><path d="${d} L300,49 L0,49 Z" fill="#ef82421a"/><path d="${d}" fill="none" stroke="#e4a16d" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><div class="mini-axis"><span>${t('wipeStart')}</span><span>${s.wipeDays} ${t('day')}</span></div></div>`;}
function render(){const matches=filterServers(servers,{query:$('search').value,region:$('region').value,capacity:$('capacity').value,wipe:$('wipe').value,rate:$('rate').value,type:$('type').value,sourcedOnly:!$('include-demo').checked,team:$('team').value,sort:$('sort').value,favoritesOnly,favorites});$('result-count').textContent=matches.length;$('favorite-count').textContent=favorites.length;$('capacity-label').textContent=$('capacity').value;$('section-title').innerHTML=(favoritesOnly?t('favoriteTitle'):t('discover'))+'<span>.</span>';$('discover').classList.toggle('active',!favoritesOnly);$('favorites-tab').classList.toggle('active',favoritesOnly);
$('server-grid').innerHTML=matches.length?matches.map(s=>`<article class="server-card" data-server="${s.id}"><button class="card-open" data-detail="${s.id}" aria-label="${s.name}: ${t('details')}"></button><button class="favorite ${favorites.includes(s.id)?'selected':''}" data-favorite="${s.id}" aria-label="${s.name}: ${t(favorites.includes(s.id)?'removeFavorite':'addFavorite')}" aria-pressed="${favorites.includes(s.id)}">${favorites.includes(s.id)?'★':'☆'}</button><div class="card-head">${logoMarkup(s)}<div><h3 class="card-name">${s.name}</h3><div class="card-sub">${s.subtitle}</div></div></div><div class="badges"><span class="badge region">${s.region}</span><span class="badge">${s.rate}x</span><span class="badge">${s.modded?t('modded'):'Vanilla'}</span><span class="badge">${s.wipeDays} ${t('days')}</span><span class="badge">${teamName(s)}</span><span class="badge">${mapSizeLabel(s.mapSize)}</span></div><div class="server-address"><span>${t('ip')}</span>${s.address?`<button class="copy-address" data-copy="${s.id}" aria-label="${t('copyIp')}">${s.address}</button>`:`<span class="unverified-ip">${t('unknownIp')}</span>`}</div><div class="wipe-info"><div><span>${t('currentWipe')}</span><strong data-current-kind="${s.id}">${wipeKind(wipeState(s).currentKind)}</strong></div><div><span>${t('nextWipe')}</span><strong data-next-kind="${s.id}">${wipeKind(wipeState(s).nextKind)}</strong></div></div><div class="countdown-row"><span>${t('countdown')}</span><time data-countdown="${s.id}"></time></div><div class="schedule-note">${t('demoSchedule')}</div>${snapshotMarkup(s)}<div class="players-row" title="${s.players>s.capacity?t('countMismatch'):''}"><span>${t(s.observation?'sourceCounts':'demoCounts')}</span><strong>${s.players} <small>/ ${s.capacity}</small></strong></div><div class="capacity-bar"><div style="width:${Math.min(100,s.players/s.capacity*100)}%"></div></div>${mini(s)}<div class="card-bottom"><span>${t(s.observation?'mixedData':'demoListing')}</span><button class="detail-button" data-detail="${s.id}" aria-label="${s.name}: ${t('analysis')}">${t('details')} <span>↗</span></button></div></article>`).join(''):`<div class="empty"><h3>${t(favoritesOnly&&!favorites.length?'noFavorites':'noResults')}</h3><p>${t(favoritesOnly&&!favorites.length?'favoriteHelp':'filterHelp')}</p><button class="detail-button" id="empty-reset">${t(favoritesOnly?'discover':'reset')}</button></div>`;
updateCountdowns();$('empty-reset')?.addEventListener('click',()=>{favoritesOnly=false;reset();});}
function reset(){for(const id of ['region','wipe','rate','type','team'])$(id).value='all';$('include-demo').checked=false;$('search').value='';$('capacity').value='2000';$('sort').value='players';render();}
for(const id of ['search','region','capacity','wipe','rate','type','team','sort','include-demo'])$(id).addEventListener('input',render);
$('reset').addEventListener('click',reset);$('language').addEventListener('change',()=>{language=$('language').value;persist('wipe-radar-language',language);applyLanguage();});
$('discover').addEventListener('click',()=>{favoritesOnly=false;render();});$('favorites-tab').addEventListener('click',()=>{favoritesOnly=true;render();$('explore').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});
$('server-grid').addEventListener('click',e=>{const copy=e.target.closest('[data-copy]');if(copy){copyAddress(copy.dataset.copy,copy);return;}const favorite=e.target.closest('[data-favorite]');if(favorite){const id=favorite.dataset.favorite;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];persist('wipe-radar-favorites',JSON.stringify(favorites));render();return;}const detail=e.target.closest('[data-detail]');if(detail){activeServer=servers.find(s=>s.id===detail.dataset.detail);activePeriod='avg';renderDetails();$('server-dialog').showModal();}});
function teamName(s){if(s.teamLimit>4)return 'Max '+s.teamLimit;return ({1:'Solo',2:'Duo',3:'Trio',4:'Quad'})[s.teamLimit]||t('unknownTeam');}
function wipeKind(kind){return t(kind==='blueprint'?'blueprintWipe':'mapWipe');}
function formatCountdown(ms){const p=countdownParts(ms);return `${p.days}${t('daysShort')} ${String(p.hours).padStart(2,'0')}${t('hoursShort')} ${String(p.minutes).padStart(2,'0')}${t('minutesShort')} ${String(p.seconds).padStart(2,'0')}${t('secondsShort')}`;}
function formatDate(ms){return new Intl.DateTimeFormat(language==='tr'?'tr-TR':'en-US',{dateStyle:'medium',timeStyle:'short'}).format(ms)+' · '+Intl.DateTimeFormat().resolvedOptions().timeZone;}
function updateCountdowns(){const now=Date.now();$('fresh-count').textContent=servers.filter(s=>s.observation).length;document.querySelectorAll('[data-countdown]').forEach(e=>{const s=servers.find(s=>s.id===e.dataset.countdown);const state=wipeState(s,now);e.textContent=formatCountdown(state.remaining);e.dateTime=new Date(state.nextAt).toISOString();e.title=formatDate(state.nextAt);});for(const [attribute,key] of [['data-current-kind','currentKind'],['data-next-kind','nextKind']])document.querySelectorAll(`[${attribute}]`).forEach(e=>{const s=servers.find(s=>s.id===e.getAttribute(attribute));e.textContent=wipeKind(wipeState(s,now)[key]);});if(activeServer){const state=wipeState(activeServer,now);for(const [id,date] of [['current-wipe-date',state.currentAt],['next-wipe-date',state.nextAt]])if($(id))$(id).textContent=formatDate(date);}}
async function copyAddress(id,button){const s=servers.find(s=>s.id===id);if(!s?.address)return;try{await navigator.clipboard.writeText(s.address);button.textContent=t('copied');setTimeout(()=>{if(button.isConnected)button.textContent=s.address;},1600);}catch{button.textContent=s.address;button.title=t('copyFailed');}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function logoMarkup(s){return `<div class="server-logo logo-${s.seed%4}" title="${escapeHtml(s.logo?s.logo.sourceUrl:t('placeholderLogo'))}"><span aria-hidden="true">${s.name[0]}</span>${s.logo?`<img src="${escapeHtml(s.logo.url)}" alt="${escapeHtml(s.name)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div>`;}
function snapshotMarkup(s){if(!s.observation)return '';return `<div class="source-snapshot"><a data-source href="${escapeHtml(s.observation.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t('sourceSnapshot')} ↗</a><span>${t('retrieved')}: ${escapeHtml(formatDate(Date.parse(s.observation.retrievedAt)))}</span><span>${t('sourceLastSeen')}: ${escapeHtml(s.observation.lastSeenText||'—')} · ${t('notLive')}</span></div>`;}
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.closest('.server-logo'))e.target.remove();},true);
function periodLabel(index){return language==='tr'?`${index+1}. ${t('previous')}`:`${index+1} ${index===0?'wipe ago':t('previous')}`;}
function renderDetails(){const s=activeServer;$('dialog-content').innerHTML=`<div class="dialog-top"><div><div class="eyebrow">${t('intelligence')} · ${s.region}</div><h2>${s.name} <span>/ ${s.subtitle}</span></h2></div><button class="close-dialog" aria-label="${t('close')}">×</button></div><p class="dialog-desc">${t('detailIntro')}</p><div class="demo-warning">${t('warning')}</div>${snapshotMarkup(s)}${s.observation?`<p class="source-server-name">${t('sourceName')}: ${escapeHtml(s.observation.sourceName)}</p>`:''}<div class="detail-metadata"><div><span>${t('teamLimit')}</span><strong>${teamName(s)}</strong></div><div><span>${t('numericMap')}</span><strong>${s.mapSize} × ${s.mapSize} ${t('mapUnit')}</strong><small>${mapSizeLabel(s.mapSize)}</small></div><div><span>${t('seedLabel')}</span><strong>${s.mapSeed}</strong></div><div><span>${t('ip')}</span><strong>${s.address||t('unknownIp')}</strong></div></div><p class="seed-help">${t('seedHelp')}</p><div class="detail-wipes"><div><span>${t('currentWipe')}</span><strong data-current-kind="${s.id}">${wipeKind(wipeState(s).currentKind)}</strong><small id="current-wipe-date"></small></div><div><span>${t('nextWipe')}</span><strong data-next-kind="${s.id}">${wipeKind(wipeState(s).nextKind)}</strong><small id="next-wipe-date"></small></div><div><span>${t('countdown')}</span><time data-countdown="${s.id}"></time><small>${t('demoSchedule')}</small></div></div><div class="chart-controls" aria-label="${t('period')}"><button data-period="avg">${t('average')}</button>${s.history.map((_,i)=>`<button data-period="${i}">${periodLabel(i)}</button>`).join('')}</div><div class="chart-heading"><strong>${t('fullWipe')} · ${s.wipeDays} ${t('day')}</strong><span>${t('sameSize')}</span></div><div id="chart"></div><label class="chart-inspector" for="chart-hour"><span>${t('inspect')}</span><output id="chart-value"></output></label><input id="chart-hour" type="range" min="0" max="${s.wipeDays*24}" value="0" step="1"><p class="graph-caption">${t('axis')}<br>${t('mean')}<br>${t('chartHint')}</p><div class="dialog-facts"><div><span>${t('every')}</span><strong>${s.wipeDays} ${t('per')}</strong></div><div><span>${t('capacityFact')}</span><strong>${s.capacity} ${t('playerWord')}</strong></div><div><span>${t('modeFact')}</span><strong>${s.modded?t('modded'):'Vanilla'} · ${s.rate}x</strong></div></div>`;
$('dialog-content').querySelector('.close-dialog').addEventListener('click',()=>$('server-dialog').close());$('dialog-content').querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{activePeriod=b.dataset.period;drawChart();}));$('chart-hour').addEventListener('input',()=>inspectHour(Number($('chart-hour').value)));drawChart();updateCountdowns();}
function selectedPoints(){return activePeriod==='avg'?averageHistory(activeServer):activeServer.history[Number(activePeriod)].points;}
function drawChart(){const s=activeServer,points=selectedPoints(),d=path(points,590,210,s.capacity,55,20),label=activePeriod==='avg'?t('average'):periodLabel(Number(activePeriod));const ticks=[0,...Array.from({length:5},(_,i)=>Math.round((i+1)*s.wipeDays/5))];
$('dialog-content').querySelectorAll('[data-period]').forEach(b=>{b.classList.toggle('active',b.dataset.period===activePeriod);b.setAttribute('aria-pressed',String(b.dataset.period===activePeriod));});
$('chart').innerHTML=`<svg class="large-chart" viewBox="0 0 680 275" role="img" aria-label="${label}, ${s.wipeDays} ${t('day')}, ${t('chartLabel')}"><title>${label} · ${s.wipeDays} ${t('day')}</title><desc>${t('axis')} ${points.length} ${t('sample')}.</desc>${[0,.25,.5,.75,1].map(v=>`<line x1="55" x2="645" y1="${230-v*210}" y2="${230-v*210}" stroke="#34383a" stroke-dasharray="3 5"/><text x="43" y="${234-v*210}" text-anchor="end" fill="#a4acb3" font-size="11">${Math.round(s.capacity*v)}</text>`).join('')}<path d="${d} L645,230 L55,230 Z" fill="#ef82421c"/><path d="${d}" fill="none" stroke="#eda873" stroke-width="1.5" stroke-linejoin="round"/>${ticks.map(day=>`<text x="${55+day*590/s.wipeDays}" y="253" text-anchor="middle" fill="#a4acb3" font-size="11">${day===0?t('wipeStart'):day+' '+t('day')}</text>`).join('')}<line id="chart-cursor" y1="20" y2="230" stroke="#ffffff70" stroke-dasharray="3 4"/><circle id="chart-dot" r="4" fill="#f4c29d" stroke="#171c20" stroke-width="2"/></svg>`;
$('chart').querySelector('svg').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect();const hour=Math.round(Math.max(0,Math.min(1,((e.clientX-r.left)/r.width*680-55)/590))*s.wipeDays*24);$('chart-hour').value=hour;inspectHour(hour);});inspectHour(Number($('chart-hour').value));}
function inspectHour(hour){const s=activeServer,points=selectedPoints(),x=55+hour/(s.wipeDays*24)*590,y=230-points[hour]/s.capacity*210;$('chart-value').textContent=`${Math.floor(hour/24)} ${t('day')} ${hour%24} ${t('hourWord')} · ${points[hour]} ${t('playerWord')}`;$('chart-cursor').setAttribute('x1',x);$('chart-cursor').setAttribute('x2',x);$('chart-dot').setAttribute('cx',x);$('chart-dot').setAttribute('cy',y);}
$('server-dialog').addEventListener('close',()=>{activeServer=null;});$('server-dialog').addEventListener('click',e=>{if(e.target===$('server-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
applyLanguage();
setInterval(updateCountdowns,1000);
</script>
</body></html>
