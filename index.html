el for="team" data-i18n="teamLimit"></label><select id="team"><option value="all" data-i18n="allTeams"></option><option value="1">Solo</option><option value="2">Duo</option><option value="3">Trio</option><option value="4">Quad</option></select></div><div class="filter-tip"><span>↗</span><strong data-i18n="tipTitle"></strong><p data-i18n="tip"></p></div></aside>
